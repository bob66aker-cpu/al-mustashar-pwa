<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المستشار الزراعي - تدقيق المبيدات والقرارات السيادية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <header class="bg-emerald-800 text-white shadow-lg p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black">🌱 المستشار الزراعي (النسخة الميدانية)</h1>
            <span class="text-xs bg-emerald-950 px-3 py-1 rounded-full border border-emerald-600">أوفلاين بالكامل</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6 mt-4">
        <!-- البحث الميداني -->
        <div class="glass-card text-slate-900 p-6 rounded-2xl shadow-xl">
            <h2 class="text-lg font-bold mb-3 text-emerald-900">🔍 التدقيق الفوري للمبيدات والقرارات</h2>
            <input type="text" id="searchInput" placeholder="اكتب اسم المادة الفعالة أو المبيد (مثال: أبامكتين)..." class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-600 outline-none">
            <div id="searchResult" class="mt-4"></div>
        </div>

        <!-- لوحة التحكم وتحديث البيانات (Admin JSON Sync) -->
        <div class="glass-card text-slate-900 p-6 rounded-2xl shadow-xl border border-amber-500">
            <h2 class="text-lg font-bold mb-2 text-amber-900">⚙️ لوحة المشرف (تحديث قاعدة البيانات محلياً)</h2>
            <p class="text-xs text-slate-600 mb-3">قم برفع ملف JSON لتحديث قاعدة المبيدات والقرارات (القرار 248 لسنة 2024 والقرار 500 لسنة 2026) دون الحاجة لتعديل الكود.</p>
            <input type="file" id="jsonUpload" accept=".json" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
            <button onclick="importJSON()" class="mt-3 bg-amber-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-amber-700">تحديث القاعدة محلياً</button>
        </div>
    </main>

    <script>
        // قاعدة البيانات الافتراضية الأولية (القرارات السيادية والمبيدات)
        const defaultDB = [
            { name: "أبامكتين", status: "مصرح", decree: "القرار 248 لسنة 2024", notes: "يُستخدم ضمن الضوابط المحددة." },
            { name: "كلوربيريفوس", status: "محظور", decree: "القرار 500 لسنة 2026", notes: "محظور نهائياً لأسباب بيئية وصحية." }
        ];

        // تهيئة التخزين المحلي
        function initDB() {
            if (!localStorage.getItem('pesticides_db')) {
                localStorage.setItem('pesticides_db', JSON.stringify(defaultDB));
            }
        }
        initDB();

        // عملية البحث
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.trim().toLowerCase();
            const db = JSON.parse(localStorage.getItem('pesticides_db') || '[]');
            const resultDiv = document.getElementById('searchResult');
            
            if (!query) {
                resultDiv.innerHTML = '';
                return;
            }

            const match = db.find(item => item.name.toLowerCase().includes(query));
            if (match) {
                const badgeColor = match.status === 'مصرح' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-rose-100 text-rose-800 border-rose-300';
                resultDiv.innerHTML = `
                    <div class="p-4 rounded-xl border ${badgeColor}">
                        <p class="font-bold text-base">المادة: ${match.name}</p>
                        <p class="text-sm font-semibold mt-1">الحالة القانونية: ${match.status}</p>
                        <p class="text-xs mt-1">السند: ${match.decree} - ${match.notes}</p>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `<div class="p-3 bg-slate-100 text-slate-700 rounded-xl text-sm">لم يتم العثور على مطابقة دقيقة داخل قاعدة البيانات المحلية. يرجى التحقق من اسم المادة.</div>`;
            }
        });

        // استيراد وتحديث قاعدة البيانات من ملف JSON
        function importJSON() {
            const fileInput = document.getElementById('jsonUpload');
            if (fileInput.files.length === 0) {
                alert('الرجاء اختيار ملف JSON أولاً.');
                return;
            }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const jsonData = JSON.parse(e.target.result);
                    localStorage.setItem('pesticides_db', JSON.stringify(jsonData));
                    alert('تم تحديث قاعدة البيانات بنجاح محلياً!');
                } catch (err) {
                    alert('ملف JSON غير صالح أو تالف.');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
